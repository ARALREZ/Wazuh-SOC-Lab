<!-- ===================================================================== -->
<!-- WAZUH MANAGER CONFIGURATION (/var/ossec/etc/ossec.conf)               -->
<!-- ===================================================================== -->

<!-- 1. VirusTotal API Integration -->
<integration>
  <name>virustotal</name>
  <api_key>YOUR_VIRUSTOTAL_API_KEY</api_key>
  <group>syscheck</group>
  <rule_id>550, 554</rule_id>
  <alert_format>json</alert_format>
</integration>

<!-- 2. Active Response Command Definition -->
<command>
  <name>host-isolate</name>
  <executable>host-isolate.sh</executable>
  <extra_args />
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- 3. Active Response Trigger Configuration -->
<active-response>
  <command>host-isolate</command>
  <location>local</location>
  <rules_id>100050</rules_id>
</active-response>

<!-- ===================================================================== -->
<!-- WAZUH AGENT CONFIGURATION (/var/ossec/etc/ossec.conf)                 -->
<!-- ===================================================================== -->

<!-- Real-time File Integrity Monitoring for Downloads directory -->
<syscheck>
  <directories realtime="yes" check_all="yes">/home/attacker/Downloads</directories>
</syscheck>
