<!-- 
  ==============================================================================
  Wazuh Manager Configuration Snippet: Active Response & Suricata Logs
  Appended to: /var/ossec/etc/ossec.conf
  ==============================================================================
-->

<!-- Suricata Log Collection -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/suricata/eve.json</location>
</localfile>

<!-- Command definition linking executable script to Wazuh framework -->
<command>
  <name>custom-block</name>
  <executable>custom-block.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- Active Response trigger binding Rules 100070 and 100071 to IP Blocking -->
<active-response>
  <command>custom-block</command>
  <location>local</location>
  <rules_id>100070, 100071</rules_id>
</active-response>
