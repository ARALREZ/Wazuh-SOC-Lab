<!-- 
  ==============================================================================
  Wazuh Manager Configuration Snippet: Active Response (SOAR Binding)
  Appended to: /var/ossec/etc/ossec.conf
  ==============================================================================
-->

<!-- Command definition linking executable script to Wazuh framework -->
<command>
  <name>quarantine_file</name>
  <executable>quarantine_file.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- Active Response trigger binding Rule 100061 to file quarantine -->
<active-response>
  <command>quarantine_file</command>
  <location>local</location> <!-- Executes locally on the agent where alert triggered -->
  <rules_id>100061</rules_id>
</active-response>
